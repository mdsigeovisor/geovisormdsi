<div class="p-6">
  <div class="border-b border-gray-200 pb-4 mb-6">
    <h3 class="text-lg font-semibold leading-6 text-gray-900">Imprimir Mapa</h3>
    <p class="mt-1 text-sm text-gray-500">
      Selecciona el formato y la resolución para exportar la vista actual del mapa a un archivo PDF.
    </p>
  </div>

  <div class="space-y-6">
    <div class="space-y-2">
      <label for="formato" class="block text-sm font-medium text-gray-700">Formato de Papel</label>
      <select id="formato" name="formato" class="mt-1 block w-full rounded-md border-gray-300 py-2 pl-3 pr-10 text-base focus:border-primary focus:outline-none focus:ring-primary sm:text-sm" [ngModel]="formato()" (ngModelChange)="formato.set($event)">
        <option value="A4">A4</option>
        <option value="A3">A3</option>
        <option value="A2">A2</option>
      </select>
    </div>

    <div>
      <label for="resolucion" class="block text-sm font-medium text-gray-700">Resoluci&oacute;n (DPI)</label>
      <select id="resolucion" name="resolucion" class="mt-1 block w-full rounded-md border-gray-300 py-2 pl-3 pr-10 text-base focus:border-primary focus:outline-none focus:ring-primary sm:text-sm" [ngModel]="resolucion()" (ngModelChange)="setResolucion($event)">
        <option value="72">72 dpi (Baja)</option>
        <option value="150">150 dpi (Media)</option>
        <option value="300">300 dpi (Alta)</option>
      </select>
    </div>

    <fieldset class="space-y-3">
      <legend class="text-sm font-medium text-gray-700">Opciones Adicionales</legend>
      <div class="relative flex items-start">
        <div class="flex h-6 items-center">
          <input id="marco" aria-describedby="marco-description" name="marco" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary" [ngModel]="incluirMarco()" (ngModelChange)="incluirMarco.set($event)">
        </div>
        <div class="ml-3 text-sm leading-6">
          <label for="marco" class="font-medium text-gray-900">Incluir Marco y Coordenadas</label>
        </div>
      </div>
      <div class="relative flex items-start">
        <div class="flex h-6 items-center">
          <input id="cuadricula" aria-describedby="cuadricula-description" name="cuadricula" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary" [ngModel]="incluirCuadricula()" (ngModelChange)="incluirCuadricula.set($event)">
        </div>
        <div class="ml-3 text-sm leading-6">
          <label for="cuadricula" class="font-medium text-gray-900">Incluir Cuadr&iacute;cula</label>
        </div>
      </div>
    </fieldset>

    <button type="button" class="flex w-full justify-center rounded-md bg-primary px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:opacity-50 disabled:cursor-not-allowed" (click)="imprimirMapa()" [disabled]="imprimiendo()">
      @if (imprimiendo()) {
        <span class="animate-pulse">Generando PDF...</span>
      } @else {
        <span>Imprimir</span>
      }
    </button>
  </div>
</div>
