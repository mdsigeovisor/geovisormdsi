<nav class="fixed z-10 top-0 left-0 w-full h-16 bg-primary backdrop-blur-md text-white flex items-center justify-between px-6 border-b border-white/10">
  <!-- Lado Izquierdo: Logo y Contador de Visitas -->
  <div class="flex-1 flex justify-start items-center gap-4">
    <div class="p-1.5 rounded-lg shadow-inner">
      <img #msiLogo
           src="assets/images/logo.png"
           alt="Municipalidad de San Isidro"
           class="h-7 sm:h-10 md:h-12 w-auto object-contain"
           (error)="msiLogo.src='https://v0.app/placeholder.svg'">
    </div>
    <!-- Contador de Visitas -->
    <div class="flex items-center gap-1.5 px-3 py-1.5 bg-white/90 rounded-md shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2d780e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>
      </svg>
      <div class="flex items-baseline gap-x-1">
        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-600">Visitas:</span>
        @if (cargandoVisitas()) {
          <span class="text-sm font-bold animate-pulse" style="color: #2d780e;">...</span>
        } @else {
          <span class="text-base font-bold cash-register-font" [title]="visitCount() | number">{{ formatearVisitas(visitCount()) }}</span>
        }
      </div>
    </div>
  </div>
  <!-- Centro: Título -->
  <div class="hidden sm:flex flex-1 items-center justify-center gap-x-6">
    <span class="text-3xl font-bold tracking-wider leading-tight text-white text-center">Geovisor Catastral</span>
  </div>
  <!-- Lado Derecho: Selector de Herramientas y Botón de Acceso -->
  <div class="flex-1 flex justify-end items-center gap-2">
    <!-- Selector de Herramientas: Tour / Dashboard / Observatorio -->
    <div class="relative">
      <select
        id="btn-menus"
        (change)="onOpcionSeleccionada($event)"
        title="Herramientas"
        class="appearance-none bg-primary text-white border border-white/30 hover:bg-secondary/10 hover:border-white/60 focus:outline-none focus:ring-2 focus:ring-white/40 px-3 py-2 pr-8 rounded-md text-sm cursor-pointer transition-all"
      >
        <option value="" disabled selected class="bg-white text-gray-800">Herramientas</option>
        <option value="tour" class="bg-white text-gray-800">Tour</option>
        <option value="dashboard" class="bg-white text-gray-800">Dashboard</option>
        <option value="observatorio" class="bg-white text-gray-800">Observatorio</option>
      </select>
      <svg class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
      </svg>
    </div>
    <button
    id="btn-auth"
    (click)="onLoginClick()"
    class="flex items-center gap-2 text-white hover:bg-secondary hover:text-white px-3 py-2 rounded-md transition-colors cursor-pointer"
    [title]="isAuthenticated() ? 'Cerrar Sesión' : 'Acceder'"
  >
    @if (isAuthenticated()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="hidden text-sm sm:inline font-medium">{{ userName() }}</span>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
        <polyline points="10 17 15 12 10 7" />
        <line x1="15" y1="12" x2="3" y2="12" />
      </svg>
      <span class="hidden text-sm sm:inline">Acceder</span>
    }
  </button>
  </div>
</nav>
<!-- Modal de Cierre de Sesión -->
@if (showLogoutModal()) {
<div class="fixed inset-0 z-[1050] flex items-center justify-center bg-black/60 animate-fade-in" (click)="cancelLogout()">
  <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg animate-scale-in" (click)="$event.stopPropagation()">
    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
      <div class="sm:flex sm:items-start">
        <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-primary/10 sm:mx-0 sm:h-10 sm:w-10">
          <svg class="h-6 w-6 text-primary" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" />
          </svg>
        </div>
        <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left">
          <h3 class="text-base font-semibold leading-6 text-gray-900" id="modal-title">Cerrar Sesión</h3>
          <div class="mt-2">
            <p class="text-sm text-gray-500">¿Está seguro de que desea cerrar la sesión? Esta acción cerrará solamente la sesión.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
      <button type="button" class="inline-flex w-full justify-center rounded-md bg-primary px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-secondary sm:ml-3 sm:w-auto" (click)="confirmLogout()">Cerrar Sesión</button>
      <button type="button" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto" (click)="cancelLogout()">Cancelar</button>
    </div>
  </div>
</div>
}
