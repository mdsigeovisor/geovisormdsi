<!-- Fondo oscurecido: clic fuera cierra (respetando la guarda de cancelar()). -->
<div class="fixed inset-0 z-[1050] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm animate-fade-in"
  (click)="cancelar()">

  <div role="dialog" aria-modal="true" aria-labelledby="login-title"
    class="flex w-full max-w-4xl overflow-hidden rounded-2xl bg-white shadow-2xl animate-scale-in"
    (click)="$event.stopPropagation()">

    <!-- Columna de la Imagen (visible en md y superior) -->
    <div class="relative hidden md:block md:w-1/2">
      <img src="assets/images/fondo.jpg" alt="Vista del distrito" class="h-full w-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-primary/90 via-primary/40 to-transparent"></div>
      <div class="absolute bottom-0 left-0 p-8 text-white">
        <img src="assets/images/logo_visor.png" alt="Geovisor Catastral" class="mb-3 h-12 w-auto drop-shadow-lg">
        <h2 class="text-2xl font-black leading-tight">Geovisor Catastral</h2>
        <p class="mt-1 text-sm text-white/80">Acceso restringido al personal autorizado.</p>
      </div>
    </div>

    <!-- Columna del Formulario -->
    <div class="flex w-full flex-col md:w-1/2">
      <!-- Encabezado del Modal -->
      <div class="flex items-center justify-between border-b border-gray-100 px-6 py-4">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl border border-primary/20 bg-primary/10 text-primary">
            <i class="bi bi-shield-lock-fill text-lg"></i>
          </div>
          <div>
            <h3 id="login-title" class="text-base font-bold leading-tight text-gray-900">Iniciar Sesión</h3>
            <p class="text-xs text-gray-400">Ingrese sus credenciales para continuar</p>
          </div>
        </div>
        <button type="button" (click)="cancelar()" aria-label="Cerrar"
          class="flex h-8 w-8 items-center justify-center rounded-full text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 cursor-pointer">
          <i class="bi bi-x-lg text-sm"></i>
        </button>
      </div>
      <!-- Formulario (ngSubmit permite enviar con Enter) -->
      <form (ngSubmit)="enviar()" class="flex-1 space-y-4 px-6 py-5">

        <!-- Mensaje de error -->
        @if (error()) {
          <div role="alert"
            class="flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 p-3 animate-fade-in">
            <i class="bi bi-exclamation-triangle-fill mt-0.5 text-red-500"></i>
            <span class="text-xs font-semibold text-red-600">{{ error() }}</span>
          </div>
        }

        <!-- Usuario -->
        <div>
          <label for="usuario"
            class="mb-1 block text-[11px] font-bold uppercase tracking-widest text-gray-400">Usuario o Correo</label>
          <div class="relative">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="bi bi-person"></i>
            </span>
            <input #usuarioInput id="usuario" name="usuario" type="text" autocomplete="username"
              [(ngModel)]="usuario" [disabled]="cargando()"
              placeholder="usuario&#64;dominio.com"
              class="w-full rounded-xl border-2 border-gray-100 bg-gray-50 py-2.5 pl-10 pr-3 text-sm text-gray-800 outline-none transition-all placeholder:text-gray-300 focus:border-primary focus:bg-white focus:ring-4 focus:ring-primary/10 disabled:opacity-60" />
          </div>
        </div>

        <!-- Contraseña -->
        <div>
          <label for="clave"
            class="mb-1 block text-[11px] font-bold uppercase tracking-widest text-gray-400">Contraseña</label>
          <div class="relative">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="bi bi-lock"></i>
            </span>
            <input #claveInput id="clave" name="clave" autocomplete="current-password"
              [type]="mostrarClave() ? 'text' : 'password'"
              [(ngModel)]="clave" [disabled]="cargando()"
              placeholder="••••••••"
              class="w-full rounded-xl border-2 border-gray-100 bg-gray-50 py-2.5 pl-10 pr-10 text-sm text-gray-800 outline-none transition-all placeholder:text-gray-300 focus:border-primary focus:bg-white focus:ring-4 focus:ring-primary/10 disabled:opacity-60" />
            <button type="button" (click)="mostrarClave.set(!mostrarClave())"
              [attr.aria-label]="mostrarClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 transition-colors hover:text-primary cursor-pointer">
              <i class="bi" [ngClass]="mostrarClave() ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>
        <!-- Recordarme -->
        <div class="flex items-center justify-between">
          <label class="flex cursor-pointer select-none items-center gap-2 text-sm text-gray-600">
            <input type="checkbox" name="recordarme" [(ngModel)]="recordarme" [disabled]="cargando()"
              class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary" />
            Recordarme
          </label>
          <span class="select-none text-[10px] italic text-gray-300" title="Disponible próximamente">
            ¿Olvidó su contraseña?
          </span>
        </div>

        <!-- Acción principal -->
        <button type="submit" [disabled]="cargando()"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary py-2.5 text-sm font-bold text-white shadow-md shadow-primary/25 transition-all hover:bg-secondary active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-70 cursor-pointer">
          @if (cargando()) {
            <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
            Verificando…
          } @else {
            <i class="bi bi-box-arrow-in-right"></i>
            Acceder
          }
        </button>
      </form>

      <!-- Pie del Modal -->
      <div class="border-t border-gray-100 bg-gray-50 px-6 py-3 text-center">
        <p class="text-[10px] text-gray-400">Municipalidad Distrital de San Isidro · Geovisor Catastral</p>
      </div>
    </div>
  </div>
</div>
