@if (!mapService.isReady()) {
<div class="fixed inset-0 z-[99999] flex flex-col items-center justify-center bg-white">
  <app-spinner size="h-40 w-40" color="text-gray-800" imageUrl="/assets/images/msibn.png">
  </app-spinner>
  <span class="mt-4 text-gray-800/70 text-xs font-light tracking-[0.2em] animate-pulse uppercase">
    Cargando Visor Geográfico del Distrito
  </span>
  <img src="/assets/images/logo_intranet.png" alt="Logo San Isidro" class="mt-8 h-24 w-auto">
</div>
}
<app-navbar></app-navbar>
<app-sidebar></app-sidebar>
<div #mapContainer class="map-container" [class.blank-base]="mapService.baseLayerType() === 'blanco'"></div>
<app-functions></app-functions>

<!-- Modal para información del lote -->
@if (mapService.loteInfoUrl(); as url) {
<div class="fixed inset-0 z-[1050] flex items-center justify-center bg-black/60 animate-fade-in" (click)="closeLoteModal()" tabindex="-1">
  <div class="flex flex-col bg-white rounded-lg shadow-lg w-full max-w-[682px] h-[85%] animate-scale-in" (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center p-4 border-b border-gray-200 bg-gray-50 rounded-t-lg">
      <h3 class="m-0 text-lg font-semibold text-gray-800">Información del Lote</h3>
      <button class="w-9 h-9 rounded-full flex items-center justify-center bg-transparent border-none text-2xl cursor-pointer transition-colors hover:bg-gray-200" (click)="closeLoteModal()" title="Cerrar">&times;</button>
    </div>
    <div class="flex-grow p-0 overflow-hidden relative">
      <!-- Indicador de carga para el iframe -->
      <div class="absolute inset-0 flex items-center justify-center bg-white/50 rounded-b-lg">
        <app-spinner size="h-40 w-40" color="text-gray-800" imageUrl="/assets/images/msibn.png"></app-spinner>
      </div>
      <!-- El iframe se mostrará por encima del spinner una vez cargado -->
      <iframe class="relative w-full h-full border-0 rounded-b-lg" [src]="getSafeUrl(url)" frameborder="0"></iframe>
    </div>
  </div>
</div>
}
