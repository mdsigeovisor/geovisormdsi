<!-- El contenido del componente ahora se renderiza directamente dentro del sidebar -->
<div>
  <div class="p-1 animate-in fade-in duration-300">
    <div class="flex p-1 mb-3 bg-gray-100 rounded-xl">
      <button (click)="coordSystem = 'GEOGRAFICA'" 
        [class]="'flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all duration-200 ' + 
        (coordSystem === 'GEOGRAFICA' ? 'bg-white text-primary shadow-sm ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-700')">
        Geográficas
      </button>
      <button (click)="coordSystem = 'UTM'" 
        [class]="'flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all duration-200 ' + 
        (coordSystem === 'UTM' ? 'bg-white text-primary shadow-sm ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-700')">
        UTM
      </button>
    </div>
    @if(coordSystem === 'GEOGRAFICA') {
    <div class="space-y-3 mb-3">
      <div>
        <label for="latitud" class="block text-[10px] font-bold text-gray-500 uppercase mb-1 ml-1">Latitud (Y)</label>
        <input id="latitud" type="number" [(ngModel)]="latitud"
          class="w-full px-3 py-1.5 bg-gray-50 border border-gray-300 rounded-lg text-[11px] focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
          placeholder="Ej: -12.046" />
      </div>
      <div>
        <label for="longitud" class="block text-[10px] font-bold text-gray-500 uppercase mb-1 ml-1">Longitud (X)</label>
        <input id="longitud" type="number" [(ngModel)]="longitud"
          class="w-full px-3 py-1.5 bg-gray-50 border border-gray-300 rounded-lg text-[11px] focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
          placeholder="Ej: -77.042" />
      </div>
    </div>
    }
    @if(coordSystem === 'UTM') {
    <div class="space-y-3 mb-3">
      <div>
        <label for="este" class="block text-[10px] font-bold text-gray-500 uppercase mb-1 ml-1">Este (X)</label>
        <input id="este" type="number" [(ngModel)]="este"
          class="w-full px-3 py-1.5 bg-gray-50 border border-gray-300 rounded-lg text-[11px] focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
          placeholder="Ej: 279530" />
      </div>
      <div>
        <label for="norte" class="block text-[10px] font-bold text-gray-500 uppercase mb-1 ml-1">Norte (Y)</label>
        <input id="norte" type="number" [(ngModel)]="norte"
          class="w-full px-3 py-1.5 bg-gray-50 border border-gray-300 rounded-lg text-[11px] focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
          placeholder="Ej: 8659795" />
      </div>
      <p class="-mt-2 text-[10px] text-gray-400 text-center italic">Zona 18S (única zona del distrito).</p>
    </div>
    }
    @if(errorMensaje) {
    <div class="mb-3 p-2.5 bg-red-50 border-l-4 border-red-500 text-red-700 text-[10px] rounded-r-lg shadow-sm flex items-start gap-2">
      <i class="bi bi-exclamation-circle-fill text-[11px] scale-90 me-1"></i>
      <span class="flex-1">{{ errorMensaje }}</span>
    </div>
    }
    <div class="flex gap-2">
      <button (click)="validarCoordenada()"
        class="flex-1 bg-primary hover:bg-primary/90 text-white text-[11px] font-bold py-2 px-3 rounded-lg shadow-md hover:shadow-lg active:transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <i class="bi bi-pin-map-fill"></i>
        Ubicar
      </button>
      <button (click)="limpiarUbicacion()" title="Limpiar campos" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 text-[11px] font-bold py-2 px-3 rounded-lg active:transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <i class="bi bi-eraser-fill"></i>
        Limpiar
      </button>
    </div>
  </div>
</div>
<!-- Marcador con efecto GPS (Ping) -->
<div #markerElement class="hidden h-10 w-10 items-center justify-center pointer-events-none z-10">
  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-60"></span>
  <span class="relative inline-flex rounded-full h-4 w-4 bg-primary border-2 border-white shadow-lg"></span>
</div>
