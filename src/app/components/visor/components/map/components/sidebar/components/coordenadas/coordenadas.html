<!-- El contenido del componente ahora se renderiza directamente dentro del sidebar -->
<div class="flex flex-col h-full">
  <div class="p-1 animate-in fade-in duration-300">
    <div class="flex p-1 mb-5 bg-gray-100 rounded-xl">
      <button (click)="coordSystem = 'GEOGRAFICA'" 
        [class]="'flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 ' + 
        (coordSystem === 'GEOGRAFICA' ? 'bg-white text-primary shadow-sm ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-700')">
        Geográficas
      </button>
      <button (click)="coordSystem = 'UTM'" 
        [class]="'flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 ' + 
        (coordSystem === 'UTM' ? 'bg-white text-primary shadow-sm ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-700')">
        UTM
      </button>
    </div>
    @if(coordSystem === 'GEOGRAFICA') {
    <div class="space-y-4 mb-5">
      <div>
        <label for="latitud" class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Latitud (Y)</label>
        <input id="latitud" type="number" [(ngModel)]="latitud"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
          placeholder="Ej: -12.046" />
      </div>
      <div>
        <label for="longitud" class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Longitud (X)</label>
        <input id="longitud" type="number" [(ngModel)]="longitud"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
          placeholder="Ej: -77.042" />
      </div>
    </div>
    }
    @if(coordSystem === 'UTM') {
    <div class="space-y-4 mb-5">
      <div>
        <label for="este" class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Este (X)</label>
        <input id="este" type="number" [(ngModel)]="este"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
          placeholder="Ej: 279530" />
      </div>
      <div>
        <label for="norte" class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Norte (Y)</label>
        <input id="norte" type="number" [(ngModel)]="norte"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
          placeholder="Ej: 8659795" />
      </div>
      <div>
        <label for="zona" class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Zona</label>
        <select id="zona" [(ngModel)]="zona"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none cursor-pointer">
          <option [ngValue]="null" disabled>Seleccione zona</option>
          <option value="17S">17S</option>
          <option value="18S">18S</option>
          <option value="19S">19S</option>
        </select>
      </div>
    </div>
    }
    @if(errorMensaje) {
    <div class="mb-5 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-xs rounded-r-lg shadow-sm flex items-start gap-2">
      <i class="bi bi-exclamation-circle-fill text-sm scale-90 me-1"></i>
      <span class="flex-1">{{ errorMensaje }}</span>
    </div>
    }
    <button (click)="validarCoordenada()"
      class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-2.5 px-4 rounded-lg shadow-md hover:shadow-lg active:transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
      <i class="bi bi-pin-map-fill"></i>
      Ubicar Coordenada
    </button>
    <button (click)="limpiarUbicacion()" title="Limpiar campos" class="w-full mt-2 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 px-4 rounded-lg active:transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
      <i class="bi bi-eraser-fill"></i>
      Limpiar
    </button>
  </div>
</div>
<!-- Marcador con efecto GPS (Ping) -->
<div #markerElement class="hidden h-10 w-10 items-center justify-center pointer-events-none z-10">
  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-60"></span>
  <span class="relative inline-flex rounded-full h-4 w-4 bg-primary border-2 border-white shadow-lg"></span>
</div>
