@if (!mapService.isReady()) {
  <div class="fixed inset-0 z-[99999] flex flex-col items-center justify-center bg-[#3C3C3B]">
    <app-spinner 
      size="h-40 w-40" 
      color="text-white" 
      imageUrl="/assets/images/spinner.png">
    </app-spinner>
    <span class="mt-4 text-white/70 text-xs font-light tracking-[0.2em] animate-pulse uppercase">
      Cargando Visor Geográfico del Distrito
    </span>
  </div>
}
<app-navbar></app-navbar>
<app-sidebar></app-sidebar>
<div #mapContainer class="map-container"></div>
<app-functions></app-functions>
