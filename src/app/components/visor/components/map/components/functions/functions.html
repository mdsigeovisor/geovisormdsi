<!-- Controles de Zoom Personalizados -->
<ng-container *ngIf="isReady()">
  <!-- Panel de funciones flotantes -->
  <div class="fixed right-4 top-1/2 -translate-y-1/2 flex flex-col gap-2 z-50 animate-in fade-in duration-500">
    <button (click)="goToSanIsidro()"
            class="w-10 h-10 flex items-center justify-center bg-primary backdrop-blur-md text-white rounded-xl shadow-lg border border-white/20 hover:bg-secondary hover:scale-105 transition-all active:scale-95 cursor-pointer"
            title="Ir a San Isidro">
      <i class="bi bi-pin-map text-xl"></i>
    </button>
    <button (click)="zoomIn()"
            class="w-10 h-10 flex items-center justify-center bg-primary backdrop-blur-md text-white rounded-xl shadow-lg border border-white/20 hover:bg-secondary hover:scale-105 transition-all active:scale-95 cursor-pointer"
            title="Acercar">
      <i class="bi bi-plus-lg text-xl"></i>
    </button>
    <button (click)="zoomOut()"
            class="w-10 h-10 flex items-center justify-center bg-primary backdrop-blur-md text-white rounded-xl shadow-lg border border-white/20 hover:bg-secondary hover:scale-105 transition-all active:scale-95 cursor-pointer"
            title="Alejar">
      <i class="bi bi-dash-lg text-xl"></i>
    </button>
    <button (click)="goHome()"
            class="w-10 h-10 flex items-center justify-center bg-primary backdrop-blur-md text-white rounded-xl shadow-lg border border-white/20 hover:bg-secondary hover:scale-105 transition-all active:scale-95 cursor-pointer"
            title="Mapa Completo">
      <i class="bi bi-house-door-fill text-xl"></i>
    </button>    
    <button (click)="getCurrentLocation()"
            class="w-10 h-10 flex items-center justify-center bg-primary backdrop-blur-md text-white rounded-xl shadow-lg border border-white/20 hover:bg-secondary hover:scale-105 transition-all active:scale-95 cursor-pointer"
            title="Mi Ubicación">
      <i class="bi bi-geo-alt-fill text-xl"></i>
    </button>
    <button (click)="toggleBaseLayer()"
            class="w-10 h-10 flex items-center justify-center bg-primary backdrop-blur-md text-white rounded-xl shadow-lg border border-white/20 hover:bg-secondary hover:scale-105 transition-all active:scale-95 cursor-pointer"
            [title]="baseLayerType() === 'satellite'
              ? 'Cambiar a Mapa de Calles'
              : baseLayerType() === 'streets'
                ? 'Quitar mapa base'
                : 'Volver a Satélite'">
      <i class="bi text-xl"
         [class.bi-map]="baseLayerType() === 'satellite'"
         [class.bi-layers-half]="baseLayerType() === 'streets'"
         [class.bi-square]="baseLayerType() === 'blanco'"></i>
    </button>
      @if (isMapBasePanelOpen()) {
    <div class="fixed right-14 top-1/2 -translate-y-1/2 z-50 w-44
                bg-white/90 backdrop-blur-xl rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.15)]
                border border-white/60 p-1 overflow-hidden
                animate-in fade-in zoom-in-95 slide-in-from-right-8 duration-300">
      <div class="px-2 py-1.5 border-b border-gray-100/50 mb-1">
        <h3 class="text-[8px] font-black text-primary uppercase tracking-[0.2em]">Galería de Mapas</h3>
      </div>      
    </div>
  }
  </div>

  <div class="hidden md:block">
    <app-overview-map [mainMap]="olMap()!"></app-overview-map>
  </div>
</ng-container>

<!-- Marcador de Usuario (Punto Azul GPS) -->
<div #userMarker
     style="display: none;"
     class="flex h-10 w-10 items-center justify-center pointer-events-none z-10">
  <!-- Efecto de pulso exterior (Halo) -->
  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400/60"></span>

  <!-- Punto central sólido con borde blanco para contraste -->
  <span class="relative inline-flex rounded-full h-4 w-4 bg-blue-600 border-2 border-white shadow-[0_0_12px_rgba(37,99,235,0.8)]"></span>
</div>

<!-- Marcador de San Isidro -->
<div #sanIsidroMarker
     style="display: none;"
     class="flex h-10 w-10 items-center justify-center pointer-events-none z-10">
  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400/60"></span>
  <span class="relative inline-flex rounded-full h-4 w-4 bg-yellow-500 border-2 border-white shadow-[0_0_12px_rgba(245,158,11,0.8)]"></span>
</div>

<!-- Popup de Información de Ubicación -->
<div #locationPopup
     style="display: none;"
     class="bg-white/95 backdrop-blur-lg p-3 rounded-2xl shadow-2xl border border-blue-100 min-w-[200px] select-none z-50 animate-in fade-in zoom-in duration-200">

  <!-- Cabecera del Popup -->
  <div class="flex items-center justify-between mb-3 pl-1">
    <div class="flex items-center gap-2">
      <div class="bg-blue-600/10 p-1.5 rounded-lg border border-blue-600/20">
        <i class="bi bi-geo-alt-fill text-blue-600 text-xs"></i>
      </div>
      <h3 class="text-gray-800 font-bold text-[10px] uppercase tracking-widest">Mi Ubicación</h3>
    </div>
    <button (click)="removeLocationMarker()"
            class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 hover:text-red-500 transition-all cursor-pointer">
      <i class="bi bi-x-lg text-xs"></i>
    </button>
  </div>

  <!-- Bloque de Coordenadas -->
  <div class="bg-gray-50 rounded-xl p-2.5 border border-gray-100 space-y-2 mb-3">
    <div class="flex justify-between items-center text-[10px]">
      <span class="text-gray-400 font-semibold tracking-tighter">LONGITUD</span>
      <span class="text-gray-700 font-mono font-bold">{{ userCoords()?.lon?.toFixed(6) }}</span>
    </div>
    <div class="flex justify-between items-center text-[10px]">
      <span class="text-gray-400 font-semibold tracking-tighter">LATITUD</span>
      <span class="text-gray-700 font-mono font-bold">{{ userCoords()?.lat?.toFixed(6) }}</span>
    </div>
  </div>

  <!-- Acción Principal -->
  <button (click)="removeLocationMarker()"
          class="w-full py-2 bg-red-50 text-red-600 text-[9px] font-black rounded-lg hover:bg-red-600 hover:text-white transition-all border border-red-100 uppercase tracking-widest active:scale-[0.98] cursor-pointer">
    Eliminar marcador
  </button>

  <!-- Triángulo inferior (Caret) -->
  <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white border-r border-b border-blue-100 rotate-45"></div>
</div>

<!-- Popup de San Isidro -->
<div #sanIsidroPopup
     style="display: none;"
     class="bg-white/95 backdrop-blur-lg p-3 rounded-2xl shadow-2xl border border-yellow-100 min-w-[200px] select-none z-50 animate-in fade-in zoom-in duration-200">
  <div class="flex items-center justify-between mb-3 pl-1">
    <div class="flex items-center gap-2">
      <div class="bg-yellow-500/10 p-1.5 rounded-lg border border-yellow-500/20">
        <i class="bi bi-pin-map text-yellow-600 text-xs"></i>
      </div>
      <h3 class="text-gray-800 font-bold text-[10px] uppercase tracking-widest">Distrito de San Isidro</h3>
    </div>
    <button (click)="hideSanIsidroPopup()"
            class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 hover:text-red-500 transition-all cursor-pointer">
      <i class="bi bi-x-lg text-xs"></i>
    </button>
  </div>
  <div class="text-gray-600 text-[11px]">Llegando al distrito con efecto animado.</div>
  <button (click)="removeSanIsidroMarker()"
          class="mt-3 w-full py-2 bg-red-50 text-red-600 text-[9px] font-black rounded-lg hover:bg-red-600 hover:text-white transition-all border border-red-100 uppercase tracking-widest active:scale-[0.98] cursor-pointer">
    Eliminar marcador de San Isidro
  </button>
  <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white border-r border-b border-yellow-100 rotate-45"></div>
</div>
