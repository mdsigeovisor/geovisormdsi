<div class="p-6 bg-white">
  <div class="border-b border-gray-200 pb-4 mb-6">
    <h3 class="text-lg font-semibold leading-6 text-gray-900">Imprimir Mapa</h3>
    <p class="mt-1 text-sm text-gray-500">
      Selecciona el formato y la resolución para exportar la vista actual del mapa a un archivo PDF.
    </p>
  </div>

  <div class="space-y-6">
    <div>
      <label for="formato" class="block text-sm font-medium text-gray-700">Formato de Papel</label>
      <select id="formato" name="formato" class="mt-1 block w-full rounded-md border-gray-300 py-2 pl-3 pr-10 text-base focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm" [ngModel]="formato()" (ngModelChange)="formato.set($event)">
        <option value="A4">A4</option>
        <option value="A3">A3</option>
        <option value="A2">A2</option>
      </select>
    </div>

    <div>
      <label for="resolucion" class="block text-sm font-medium text-gray-700">Resolución (DPI)</label>
      <select id="resolucion" name="resolucion" class="mt-1 block w-full rounded-md border-gray-300 py-2 pl-3 pr-10 text-base focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm" [ngModel]="resolucion()" (ngModelChange)="setResolucion($event)">
        <option value="72">72 dpi (Baja)</option>
        <option value="150">150 dpi (Media)</option>
        <option value="300">300 dpi (Alta)</option>
      </select>
    </div>

    <button type="button" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed" (click)="imprimirMapa()" [disabled]="imprimiendo()">
      @if (imprimiendo()) {
        <span class="animate-pulse">Generando PDF...</span>
      } @else {
        <span>Imprimir</span>
      }
    </button>
  </div>
</div>
