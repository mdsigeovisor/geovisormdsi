<div class="fixed bottom-2 left-1/2 -translate-x-1/2 z-50 w-max max-w-[95vw] pointer-events-none">
  <div id="tour-coordinate-info" class="bg-primary/90 backdrop-blur-md rounded-xl px-4.5 py-2.25 shadow-2xl border border-white/10 pointer-events-auto">
    <div class="flex flex-col md:flex-row items-center gap-y-2 md:gap-x-4.5 text-[11px] text-white font-mono">
      <!-- Grupo 1: DATUM + Coordenadas Geográficas -->
      <div class="flex items-center gap-4.5">
        <div class="flex items-center gap-1">
          <span class="font-black uppercase tracking-tighter">DATUM WGS 84</span>
        </div>
        <div class="w-px h-4.5 bg-white/20"></div>
        
        <div class="flex items-center gap-4.5">
          <div class="flex items-center gap-1">
            <span class="text-white/60 font-bold uppercase">Lat:</span>
            <span class="font-bold">{{ lat.toFixed(5) || '---' }}</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="text-white/60 font-bold uppercase">Lon:</span>
            <span class="font-bold">{{ lon.toFixed(5) || '---' }}</span>
          </div>
        </div>
      </div>
      <!-- Separador vertical que solo se muestra en Desktop -->
      <div class="hidden md:block w-px h-4.5 bg-white/20"></div>
      <!-- Grupo 2: Información UTM -->
      <div class="flex items-center gap-4.5">
        <div class="flex items-center gap-1">
          <span class="text-white/60 font-bold uppercase">Zona:</span>
          <span class="font-bold">{{ zona || '--' }}</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white/60 font-bold uppercase">N:</span>
          <span class="font-bold">{{ norte.toFixed(2) || '---' }}</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white/60 font-bold uppercase">E:</span>
          <span class="font-bold">{{ este.toFixed(2) || '---' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
